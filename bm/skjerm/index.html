<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skjermmodus – Kryptonytt Norge</title><meta name="robots" content="noindex"><link rel="canonical" href="https://jqrgen.github.io/kryptonytt/bm/skjerm/"><link rel="alternate" hreflang="nn" href="https://jqrgen.github.io/kryptonytt/skjerm/"><link rel="alternate" hreflang="nb" href="https://jqrgen.github.io/kryptonytt/bm/skjerm/"><link rel="alternate" hreflang="en" href="https://jqrgen.github.io/kryptonytt/en/skjerm/"><link rel="alternate" hreflang="x-default" href="https://jqrgen.github.io/kryptonytt/skjerm/">
<meta name="description" content="Fullskjerm-visning av Kryptonytt Norge for kontorskjerm.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23b45309'/%3E%3Ctext x='8' y='12.5' font-size='12' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EK%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d10;--fg:#f5f5f4;--mut:#a8a29e;--line:#2c3036;--card:#14181d;--acc:#f59e0b;--pub:#60a5fa;--priv:#34d399}
body.lys{--bg:#fff;--fg:#0a0a0a;--mut:#44403c;--line:#d6d3d1;--card:#f5f5f4;--acc:#b45309;--pub:#1d4ed8;--priv:#047857}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:400 clamp(16px,1.25vw,30px)/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.idle,body.idle *{cursor:none!important}
a{color:inherit;text-decoration:none}
.app{height:100vh;display:grid;gap:1.1vmin;padding:1.6vmin}
header{display:flex;align-items:center;gap:2vmin;border-bottom:.45vmin solid var(--acc);padding-bottom:1vmin}
.brand{font-weight:800;font-size:2.4em;letter-spacing:-.02em}.brand span{color:var(--acc)}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:2.4em}
.date{color:var(--mut);font-size:1em;text-align:right}
.ctl{display:flex;gap:.6em}.ctl button{font:inherit;font-size:.8em;background:transparent;color:var(--fg);border:2px solid var(--line);padding:.3em .7em;cursor:pointer}
.ctl button:focus-visible{outline:3px solid var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);padding:1.4vmin 1.8vmin;overflow:hidden;position:relative;min-height:0;display:flex;flex-direction:column}
.panel h2{margin:0 0 .6em;font-size:1em;text-transform:uppercase;letter-spacing:.12em;color:var(--acc)}
.news{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:hidden}
.news li{padding:.75em 0;border-bottom:1px solid var(--line);transition:opacity .6s}
.news .t{font-weight:700;font-size:1.55em;line-height:1.2}
.news .m{color:var(--mut);font-size:.95em;margin:.25em 0}.news .m b{color:var(--fg)}
.news .s{font-size:1.1em}
.tag{display:inline-block;border:1px solid var(--line);padding:0 .4em;font-size:.8em;margin-left:.3em;color:var(--mut)}
.pager{color:var(--mut);font-size:.85em;margin-top:.4em}
.spot{display:flex;gap:1.2em;align-items:center;transition:opacity .6s}
.av{width:7em;height:7em;border-radius:50%;object-fit:cover;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6em;color:var(--fg)}
.spot>div{min-width:0}.spot .n{overflow-wrap:anywhere;font-size:1.6em;font-weight:800;line-height:1.15}.spot .r{font-size:1.1em}.spot .o{color:var(--mut)}
.sec{display:inline-block;font-size:.8em;padding:.05em .5em;border:2px solid;margin-top:.3em}.sec.pub{color:var(--pub)}.sec.priv{color:var(--priv)}
.credit{color:var(--mut);font-size:.7em;margin-top:.3em}
.evs{list-style:none;margin:0 0 .8em;padding:0}.evs li{padding:.3em 0;border-bottom:1px solid var(--line)}.evs b{display:block}.evs span{color:var(--mut);font-size:.85em}.evs .paid{color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-top:auto;padding-top:1em}
.stat{border:1px solid var(--line);padding:.5em .7em}.stat b{display:block;font-size:2em;line-height:1}.stat span{color:var(--mut);font-size:.85em}
.srcs{list-style:none;margin:0;padding:0;columns:2;column-gap:1.2em;font-size:.95em}.srcs li{break-inside:avoid;padding:.12em 0}.srcs li::before{content:"● ";color:var(--priv)}
footer{color:var(--mut);font-size:.8em;display:flex;gap:1.5em;flex-wrap:wrap}
/* liggende: tre kolonner */
@media (orientation: landscape){
 .app{grid-template-columns:2.1fr 1fr 1fr;grid-template-rows:auto 1fr auto}
 header,footer{grid-column:1/-1}
 #pNews{grid-row:2}#pOrg{grid-row:2}#pSrc{grid-row:2}
 .spot{flex-direction:column;align-items:flex-start}
}
/* høykant: vertikal strøm */
@media (orientation: portrait){
 html,body{font-size:clamp(16px,2.1vw,34px)}
 .app{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1.7fr) minmax(0,1fr) auto}
 header,footer{grid-column:1/-1}#pNews{grid-column:1/-1;grid-row:2}footer{grid-row:4}
 #pOrg{grid-row:3}#pSrc{grid-row:3}.srcs{columns:2}
 .news .t{font-size:1.45em}
 .av{width:5.5em;height:5.5em}
}
</style></head>
<body>
<div class="app">
<header><div class="brand">Krypto<span>nytt</span> Norge</div><div class="ctl"><button id="fs" type="button">⛶ Fullskjerm</button><button id="theme" type="button">Lyst tema</button><a href="../" style="align-self:center;font-size:.8em;text-decoration:underline">Til nettstedet</a></div>
<div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div></header>
<section class="panel" id="pNews" aria-live="polite"><h2>Siste nyheter</h2><ol class="news" id="news"></ol><div class="pager" id="pager"></div></section>
<section class="panel" id="pOrg"><h2>Hvem er hvem</h2><div class="spot" id="spot"></div><div class="stats" id="stats"></div></section>
<section class="panel" id="pSrc"><div id="evbox" hidden><h2>Kommende arrangementer</h2><ul class="evs" id="evs"></ul></div><h2>Kilder vi følger</h2><ul class="srcs" id="srcs"></ul></section>
<footer><span id="upd">Laster …</span><span>Oppsummeringer: redaksjonen, laget med hjelp av kunstig intelligens. Ingen investeringsråd. Ingen sporing.</span><span>jqrgen.github.io/kryptonytt</span></footer>
</div>
<script>
(function(){
var TOPIC={"bitcoin": "Bitcoin", "blokkjede": "Blokkjede", "krypto": "Krypto", "regulering": "Regulering", "selskaper": "Selskaper"},DATA={news:[],org:{entities:[],relations:[]},src:[]},page=0,spotI=0,PER=5,REFRESH=5*60*1000,ROT=12000,SPOT=9000;
var $=function(i){return document.getElementById(i)},esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var M=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'],D=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
function fmt(iso){var d=new Date(iso);return d.getDate()+'. '+M[d.getMonth()]}
function tick(){var d=new Date();$('clock').textContent=d.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Oslo'});$('date').textContent=D[d.getDay()]+' '+d.getDate()+'. '+M[d.getMonth()]+' '+d.getFullYear()}
function perPage(){return window.matchMedia('(orientation: portrait)').matches?7:5}
function renderNews(){var n=DATA.news,per=perPage(),pages=Math.max(1,Math.ceil(n.length/per));page=page%pages;var ol=$('news');ol.style.opacity=0;
 setTimeout(function(){ol.innerHTML=n.slice(page*per,page*per+per).map(function(i){return '<li><div class="t">'+esc(i.title)+'</div><div class="m"><b>'+esc(i.source_name)+'</b> · '+fmt(i.published)+(i.topics||[]).map(function(t){return '<span class="tag">'+esc(TOPIC[t]||t)+'</span>'}).join('')+'</div><div class="s">'+esc(i.summary)+'</div></li>'}).join('')||'<li>Ingen saker ennå.</li>';
 // fjern saker som ikke får plass (ingen scrolling)
 var lis=[].slice.call(ol.children);for(var k=lis.length-1;k>0&&ol.scrollHeight>ol.clientHeight+2;k--){lis[k].remove()}
 ol.style.opacity=1;$('pager').textContent=n.length?('Side '+(page+1)+' av '+pages+' · '+n.length+' saker'):''},300)}
function initials(n){return n.split(/[\s-]+/).filter(Boolean).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}
function renderSpot(){var E=DATA.org.entities,by={};E.forEach(function(e){by[e.id]=e});var P=E.filter(function(e){return e.type==='person'});if(!P.length){$('spot').innerHTML='';return}
 var p=P[spotI%P.length],o=p.org&&by[p.org]?by[p.org].name:'',s=$('spot');s.style.opacity=0;
 setTimeout(function(){s.innerHTML=(p.image&&p.image.file?'<img class="av" src="../../'+esc(p.image.file)+'" alt="">':'<div class="av">'+esc(initials(p.name))+'</div>')+'<div><div class="n">'+esc(p.name)+'</div><div class="r">'+esc(p.role||'')+'</div><div class="o">'+esc(o)+'</div><span class="sec '+(p.sector==='offentlig'?'pub':'priv')+'">'+(p.sector==='offentlig'?'Offentlig sektor':'Privat sektor')+'</span>'+(p.image&&p.image.file?'<div class="credit">Foto: '+esc(p.image.author)+', '+esc(p.image.license)+'</div>':'')+'<div class="credit">Kilde: '+esc((p.sources[0]||{}).source_name||'')+'</div></div>';s.style.opacity=1},300);
 var orgs=E.filter(function(e){return e.type!=='person'});
 $('stats').innerHTML='<div class="stat"><b>'+orgs.filter(function(e){return e.sector==='privat'}).length+'</b><span>aktører i privat sektor</span></div><div class="stat"><b>'+orgs.filter(function(e){return e.sector==='offentlig'}).length+'</b><span>i offentlig sektor</span></div><div class="stat"><b>'+P.length+'</b><span>personer i offentlige roller</span></div><div class="stat"><b>'+DATA.org.relations.length+'</b><span>kildebelagte koblinger</span></div>'}
function renderEv(){var e=(DATA.ev||[]).slice(0,3),M=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];$('evbox').hidden=!e.length;
 $('evs').innerHTML=e.map(function(x){var d=new Date(x.start),t=d.toLocaleString('nb-NO',{timeZone:'Europe/Oslo',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 return '<li><b>'+esc(x.title)+'</b><span>'+esc(t)+' · '+esc(x.city||x.place||'Digitalt')+' · '+esc(x.organiser)+(x.paid?' · <span class="paid">Betalt</span>':'')+(x.sponsored?' · <span class="paid">Sponset</span>':'')+'</span></li>'}).join('')}
function renderSrc(){renderEv();$('srcs').innerHTML=DATA.src.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')}
function load(){var t='?t='+Date.now();Promise.all([fetch('../../data/news.json'+t).then(function(r){return r.json()}),fetch('../../data/orgchart.json'+t).then(function(r){return r.json()}),fetch('../../data/sources.json'+t).then(function(r){return r.json()}),fetch('../../data/events.json'+t).then(function(r){return r.json()}).catch(function(){return {events:[]}})]).then(function(a){DATA.ev=a[3].events||[];
 DATA.news=a[0].items||[];DATA.org=a[1];DATA.src=a[2].active||[];var u=a[0].updated?new Date(a[0].updated):null;
 $('upd').textContent='Sist oppdatert: '+(u?u.toLocaleString('nb-NO',{timeZone:'Europe/Oslo',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'ukjent')+' · data hentet '+new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Oslo'});
 renderNews();renderSpot();renderSrc()}).catch(function(){$('upd').textContent='Kunne ikke hente data – prøver igjen om 5 minutter'})}
// fullskjerm og wake lock
var lock=null;function wake(){if('wakeLock' in navigator&&document.visibilityState==='visible'){navigator.wakeLock.request('screen').then(function(l){lock=l}).catch(function(){})}}
$('fs').addEventListener('click',function(){var d=document.documentElement;if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d)}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}wake()});
document.addEventListener('fullscreenchange',function(){$('fs').textContent=document.fullscreenElement?'Avslutt fullskjerm':'⛶ Fullskjerm'});
document.addEventListener('visibilitychange',wake);
// tema
function setTheme(l){document.body.classList.toggle('lys',l);$('theme').textContent=l?'Mørkt tema':'Lyst tema';try{localStorage.setItem('kn-tema',l?'lys':'mork')}catch(e){}}
var q=new URLSearchParams(location.search),st=null;try{st=localStorage.getItem('kn-tema')}catch(e){}
setTheme(q.get('tema')==='lys'||(q.get('tema')!=='mork'&&st==='lys'));$('theme').addEventListener('click',function(){setTheme(!document.body.classList.contains('lys'))});
// skjul markør ved inaktivitet
var idle;function act(){document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(function(){document.body.classList.add('idle')},3000)}['mousemove','mousedown','touchstart','keydown'].forEach(function(e){document.addEventListener(e,act,{passive:true})});act();
window.matchMedia('(orientation: portrait)').addEventListener('change',function(){renderNews()});
tick();setInterval(tick,1000);load();setInterval(load,REFRESH);wake();
setInterval(function(){page++;renderNews()},ROT);setInterval(function(){spotI++;renderSpot()},SPOT);
})();
</script>
</body></html>
